<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-label="Real IQuest-Q1 engineering evaluation: H0 versus H1"><title>Real IQuest-Q1 engineering evaluation: H0 versus H1</title><style>text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#243447}.title{font-size:24px;font-weight:700}.small{font-size:12px;fill:#526477}.label{font-weight:600}</style><rect width="1000" height="390" fill="#fff"/><text x="35" y="40" class="title">Fewer model interactions; same task outcomes</text><text x="35" y="67" class="small">IQuest-Q1 · 6 tasks × 2 repeats / harness · real Pi sessions</text><text x="35" y="110" class="label">LLM tool calls</text><text x="35" y="160">H0</text><rect data-metric="llmToolCalls" data-harness="H0" data-value="16" x="70" y="135" width="330" height="38" fill="#8799ad"/><text x="410" y="160" class="label">16</text><text x="35" y="225">H1</text><rect data-metric="llmToolCalls" data-harness="H1" data-value="12" x="70" y="200" width="247.5" height="38" fill="#326b9d"/><text x="327.5" y="225" class="label">12</text><text x="35" y="284" class="label">Reduction: 25.00%</text><text x="515" y="110" class="label">Provider total tokens</text><text x="515" y="160">H0</text><rect data-metric="modelTokens" data-harness="H0" data-value="13718" x="550" y="135" width="330" height="38" fill="#8799ad"/><text x="890" y="160" class="label">13,718</text><text x="515" y="225">H1</text><rect data-metric="modelTokens" data-harness="H1" data-value="11382" x="550" y="200" width="273.8052194197405" height="38" fill="#326b9d"/><text x="833.8052194197405" y="225" class="label">11,382</text><text x="515" y="284" class="label">Reduction: 17.03%</text><text x="35" y="324" class="small">Business success 4/12 → 4/12; handling 12/12 → 12/12; attempts 16 → 16; duplicate writes 0 → 0.</text><text x="35" y="347" class="small">Latency 40.225s → 39.414s (task totals). Small sample; no statistical-significance claim.</text><text x="35" y="370" class="small">Sou