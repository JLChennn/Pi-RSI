<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360" role="img" aria-label="Pi-RSI: failure-driven harness code evolution"><title>Pi-RSI: failure-driven harness code evolution</title><style>text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#243447}.title{font-size:24px;font-weight:700}.small{font-size:12px;fill:#526477}.label{font-weight:600}</style><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7" fill="#64748b"/></marker></defs><rect width="1120" height="360" fill="#f8fafc"/><text x="35" y="40" class="title">Run → Reflect → Rewrite → Evaluate → Accept / Rollback</text><path d="M260 117H310" stroke="#64748b" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M530 117H580" stroke="#64748b" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M800 117H850" stroke="#64748b" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M960 149V235" stroke="#64748b" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M850 267H800" stroke="#64748b" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M580 267H530" stroke="#64748b" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M310 267H260" stroke="#64748b" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M150 235V149" stroke="#64748b" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="40" y="85" width="220" height="64" rx="6" fill="#fff" stroke="#aab9ca"/><text x="150" y="111" text-anchor="middle" class="label">Pi Worker</text><text x="150" y="132" text-anchor="middle" class="small">Real task + controlled faults</text><rect x="310" y="85" width="220" height="64" rx="6" fill="#fff" stroke="#aab9ca"/><text x="420" y="111" text-anchor="middle" class="label">Trajectory Collector</text><text x="420" y="132" text-anchor="middle" class="small">Calls, attempts, state, usage</text><rect x="580" y="85" width="220" height="64" rx="6" fill="#fff" stroke="#aab9ca"/><text x="690" y="111" text-anchor="middle" class="label">Pi Evolver</text><text x="690" y="132" text-anchor="middle" class="small">Independent session; no tools</text><rect x="850" y="85" width="220" height="64" rx="6" fill="#fff" stroke="#aab9ca"/><text x="960" y="111" text-anchor="middle" class="label">Candidate Policy</text><text x="960" y="132" text-anchor="middle" class="small">One TypeScript function</text><rect x="850" y="235" width="220" height="64" rx="6" fill="#fff" stroke="#aab9ca"/><text x="960" y="261" text-anchor="middle" class="label">Docker Validation</text><text x="960" y="282" text-anchor="middle" class="small">No network or credentials</text><rect x="580" y="235" width="220" height="64" rx="6" fill="#fff" stroke="#aab9ca"/><text x="690" y="261" text-anchor="middle" class="label">Evaluator / Selector</text><text x="690" y="282" text-anchor="middle" class="small">Paired E2E + fixed gates</text><rect x="310" y="235" width="220" height="64" rx="6" fill="#fff" stroke="#aab9ca"/><text x="420" y="261" text-anchor="middle" class="label">Version Manager</text><text x="420" y="282" text-anchor="middle" class="small">Accept / keep / rollback</text><rect x="40" y="235" width="220" height="64" rx="6" fill="#fff" stroke="#aab9ca"/><text x="150" y="261" text-anchor="middle" class="label">Next Worker</text><text x="150" y="282" text-anchor="middle" class="small">Loads accepted snapshot</text><text x="35" y="339" class="small">Host: trusted Pi + model boundary. Candidate: isolated Docker. REJECT / INCONCLUSIVE retain the current policy.</text></svg>